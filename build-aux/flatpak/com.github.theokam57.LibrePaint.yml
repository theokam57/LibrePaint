app-id: com.github.theokam57.LibrePaint
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: libre-paint
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - ./dotnet-install.sh --install-dir /app/dotnet --channel 8.0
    sources:
      - type: file
        url: https://dot.net/v1/dotnet-install.sh
        sha256: d6b0932f79b1f3c7e5c3f3a9e6a3c3f3a9e6a3c3f3a9e6a3c3f3a9e6a3c3f3a9  # aktualizuj SHA256

  - name: libre-paint
    buildsystem: simple
    build-commands:
      - export PATH=/app/dotnet:$PATH
      - dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o /app/bin
      - install -Dm755 /app/bin/LibrePaint.Desktop /app/bin/libre-paint
      - install -Dm644 assets/icons/libre-paint.png /app/share/icons/hicolor/256x256/apps/com.github.theokam57.LibrePaint.png
      - install -Dm644 build-aux/flatpak/com.github.theokam57.LibrePaint.metainfo.xml /app/share/metainfo/com.github.theokam57.LibrePaint.metainfo.xml
      - install -Dm644 build-aux/flatpak/com.github.theokam57.LibrePaint.desktop /app/share/applications/com.github.theokam57.LibrePaint.desktop
    sources:
      - type: dir
        path: .